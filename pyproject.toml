[project]
name = "stock-bot"
version = "0.1.0"
description = "Rolling-universe swing-trading research and Monte Carlo backtester"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1,<3",
    "yfinance>=0.2",
]

[tool.ruff]
target-version = "py311"

[tool.pyright]
include = ["marketsignallab/src", "main.py"]
extraPaths = ["marketsignallab/src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.4.2",
    "ruff>=0.16.4",
]
